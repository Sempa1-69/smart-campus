<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Smart Campus AI</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content">
<div class="page-head"><div><h1>Dashboard</h1><span class="muted" id="subtitle"></span></div></div>
<section class="kpis" id="kpis"></section>
<div class="grid2">
  <div class="card"><h3>Энергопотребление по корпусам</h3><div class="chart-box"><canvas id="energyChart"></canvas></div></div>
  <div class="card"><h3>Средняя температура (тренд)</h3><div class="chart-box"><canvas id="tempChart"></canvas></div></div>
</div>
<div class="grid2">
  <div class="card"><h3>Статус устройств</h3><div class="chart-box"><canvas id="deviceChart"></canvas></div></div>
  <div class="card"><h3>Последние уведомления</h3><div id="alerts"></div></div>
</div>
</main>
</div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
