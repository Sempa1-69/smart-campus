<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms — Smart Campus AI</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content">
<div class="page-head"><h1>Помещения</h1></div>
<div class="toolbar">
  <input id="search" type="search" placeholder="Поиск по номеру, типу, корпусу">
  <select id="fBuilding"><option value="">Все корпуса</option></select>
  <select id="fStatus">
    <option value="">Любой статус</option>
    <option value="normal">Normal</option>
    <option value="warning">Warning</option>
    <option value="critical">Critical</option>
  </select>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>ID</th><th>Корпус</th><th>Этаж</th><th>Тип</th><th>Темп., °C</th><th>CO₂, ppm</th><th>Энергия, кВт·ч</th><th>Людей</th><th>Статус</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<p class="muted" id="count"></p>
</main>
</div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/rooms.js"></script>
</body>
</html>
